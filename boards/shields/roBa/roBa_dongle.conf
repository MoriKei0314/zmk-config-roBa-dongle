# --- システム設定 ---
CONFIG_ZMK_SPLIT=y
CONFIG_ZMK_SPLIT_ROLE_CENTRAL=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=2
# 3 was exactly full (L + R + host) with zero headroom and left only
# ZMK_BLE_PROFILE_COUNT = 3 - 2 = 1 host profile. 6 is the ZMK split
# central default and restores headroom for reconnect races.
CONFIG_BT_MAX_CONN=6
CONFIG_BT_MAX_PAIRED=6

# Split link responsiveness: preferred peripheral latency 30 -> 10
# (central-side option, ZMK_SPLIT_BLE_PREF_LATENCY). With latency 30 a
# peripheral may sleep through ~31 connection events (~230 ms), which
# makes reconnects and fast encoder input feel dead and lets the
# peripheral position queue overflow.
CONFIG_ZMK_SPLIT_BLE_PREF_LATENCY=10

# Link margin: raise BLE TX power from the Zephyr default (0 dBm) to
# +8 dBm, the nRF52840 maximum (BT_CTLR_TX_PWR choice).
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

CONFIG_ZMK_USB=y
CONFIG_USB_DEVICE_HID=y
CONFIG_USB_HID_BOOT_PROTOCOL=y
CONFIG_ZMK_SLEEP=n

# NOTE (wave10-F): ZMK Studio is NOT enabled here. The build.yaml
# dongle entry keeps the studio-rpc-usb-uart snippet, but adding
# CONFIG_ZMK_STUDIO=y to this config makes the dongle West build
# fail on current ZMK main (verified by bisection, runs #399-#409:
# snippet alone OK, battery conf alone OK, processors OK,
# CONFIG_ZMK_STUDIO=y alone fails). Job logs are not accessible
# from here, so the inner reason (flash budget vs Kconfig/DT
# conflict with dongle_display) is unconfirmed. Re-enable only
# after checking a local build log.

# --- バッテリー (central side, wave10-F) ---
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y

# --- 入力デバイス設定 ---
CONFIG_ZMK_POINTING=y
CONFIG_ZMK_INPUT_SPLIT=y
CONFIG_ZMK_MOUSE=y
CONFIG_INPUT=y

# --- ディスプレイ設定 ---
CONFIG_ZMK_DISPLAY=y

# [重要] 砂嵐・ノイズ対策 1: 描画専用スレッド
CONFIG_ZMK_DISPLAY_WORK_QUEUE_DEDICATED=y

# [重要] 砂嵐・ノイズ対策 2: スタックサイズ拡張
# これが前回のビルドエラーで適用されていなかったため、砂嵐が直らなかった可能性が高いです
CONFIG_ZMK_DISPLAY_DEDICATED_THREAD_STACK_SIZE=4096

# 画面の向き補正
CONFIG_ZMK_DISPLAY_INVERT=n

# --- 標準ウィジェット無効化 (エラー回避) ---
CONFIG_ZMK_WIDGET_LAYER_STATUS=n
CONFIG_ZMK_WIDGET_BATTERY_STATUS=n
CONFIG_ZMK_WIDGET_OUTPUT_STATUS=n
CONFIG_ZMK_WIDGET_PERIPHERAL_STATUS=n
