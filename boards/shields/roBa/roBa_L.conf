CONFIG_ZMK_KEYBOARD_NAME="roBa Left"
CONFIG_EC11=y
# Own thread instead of the global work queue: with GLOBAL_THREAD the
# EC11 driver defers edge handling to the system work queue, and edges
# arriving while it is busy (e.g. BLE traffic) are missed.
CONFIG_EC11_TRIGGER_OWN_THREAD=y
CONFIG_ZMK_POINTING=y
CONFIG_NFCT_PINS_AS_GPIOS=y
CONFIG_ZMK_SPLIT=y
CONFIG_ZMK_SPLIT_ROLE_CENTRAL=n
CONFIG_ZMK_BATTERY_REPORTING=y
# NOTE: CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY / _FETCHING
# were removed: they are central-role-only options (Kconfig guards them
# with ZMK_SPLIT_ROLE_CENTRAL) and were inert leftovers on this
# peripheral from the original kumamuk layout where a half was central.
# Peripheral-side queue for key/sensor events towards the central:
# 10 (default) -> 30, so fast encoder rotation is not dropped when the
# split link is briefly busy.
CONFIG_ZMK_SPLIT_BLE_PERIPHERAL_POSITION_QUEUE_SIZE=30
# Link margin: BLE TX power 0 dBm (Zephyr default) -> +8 dBm.
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
